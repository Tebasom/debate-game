<!DOCTYPE html>
<html>
<head>
  <title>Debate Duel - Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 80%;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      width: 90%;
      padding: 18px;
      font-size: 22px;
      margin: 8px;
      border-radius: 12px;
      border: none;
    }
    .agree { background: #007bff; }
    .disagree { background: #dc3545; }
    .vote { background: #555; }
    .mod { background: #28a745; }
    .lock { background: #ffc107; color: black; }
  </style>
</head>
<body>

<h1 id="question">Resolved: Phones should be banned in schools</h1>

<input id="name" placeholder="Enter your name" />

<button class="agree" onclick="press('agree')">🔵 AGREE</button>
<button class="disagree" onclick="press('disagree')">🔴 DISAGREE</button>

<h2 id="matchup"></h2>
<h2 id="timer">⏳ Waiting...</h2>

<button class="vote" onclick="vote('agree')">Vote Out 🔵 Agree</button>
<button class="vote" onclick="vote('disagree')">Vote Out 🔴 Disagree</button>

<h3 id="votes"></h3>

<hr>

<h2>Moderator Controls</h2>
<button class="mod" onclick="resetGame()">🔄 Reset Round</button>

<script>
  let players = { agree: null, disagree: null };
  let votes = { agree: 0, disagree: 0 };
  let lock = false;
  let timer = 0;
  let timerInterval;

  function press(side) {
    const name = document.getElementById("name").value.trim();
    if (!name) return alert("Enter your name first!");
    if (lock) return;
    if (!players[side]) {
      players[side] = { name };
      updateMatchup();
      if (players.agree && players.disagree) {
        startTimer(60);
      }
    }
  }

  function vote(side) {
    votes[side]++;
    updateVotes();
  }

  function updateMatchup() {
    const matchup = (players.agree && players.disagree)
      ? `🔵 ${players.agree.name} VS 🔴 ${players.disagree.name}`
      : '';
    document.getElementById("matchup").innerText = matchup;
  }

  function updateVotes() {
    document.getElementById("votes").innerText = `Votes — 🔵 ${votes.agree} | 🔴 ${votes.disagree}`;
  }

  function resetGame() {
    players = { agree: null, disagree: null };
    votes = { agree: 0, disagree: 0 };
    lock = false;
    clearInterval(timerInterval);
    document.getElementById("timer").innerText = '⏳ Waiting...';
    updateMatchup();
    updateVotes();
  }

  function startTimer(seconds) {
    timer = seconds;
    document.getElementById("timer").innerText = `⏱ ${timer}s remaining`;
    timerInterval = setInterval(() => {
      timer--;
      document.getElementById("timer").innerText = `⏱ ${timer}s remaining`;
      if (timer <= 0) clearInterval(timerInterval);
    }, 1000);
  }
</script>

</body>
</html>
