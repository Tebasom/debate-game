<!DOCTYPE html>
<html>
<head>
  <title>Debate Duel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 80%;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      width: 90%;
      padding: 18px;
      font-size: 22px;
      margin: 8px;
      border-radius: 12px;
      border: none;
    }
    .agree { background: #007bff; }
    .disagree { background: #dc3545; }
    .vote { background: #555; }
    .mod { background: #28a745; }
    .lock { background: #ffc107; color: black; }
  </style>
</head>
<body>

<h1 id="question">Resolved: Phones should be banned in schools</h1>

<input id="name" placeholder="Enter your name" />

<button class="agree" onclick="press('agree')">🔵 AGREE</button>
<button class="disagree" onclick="press('disagree')">🔴 DISAGREE</button>

<h2 id="matchup"></h2>
<h2 id="timer">⏳ Waiting...</h2>

<button class="vote" onclick="vote('agree')">Vote Out 🔵 Agree</button>
<button class="vote" onclick="vote('disagree')">Vote Out 🔴 Disagree</button>

<h3 id="votes"></h3>

<hr>

<h2>Moderator Controls</h2>
<button class="mod" onclick="resetGame()">🔄 Reset Round</button>
<button class="lock" onclick="toggleLock()">🔒 Lock / Unlock Buttons</button>

<script type="module">
  // Import Firebase modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  // 🔥 Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBRoK6bv-4dt_uqLTK_-klVpw-XoNze64w",
    authDomain: "debate-game-cf108.firebaseapp.com",
    databaseURL: "https://debate-game-cf108-default-rtdb.firebaseio.com",
    projectId: "debate-game-cf108",
    storageBucket: "debate-game-cf108.firebasestorage.app",
    messagingSenderId: "709419348757",
    appId: "1:709419348757:web:b4f61976d6464664976f1c",
    measurementId: "G-Q1JFS38741"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const userId = Math.random().toString(36).substring(2);

  function press(side) {
    const name = document.getElementById("name").value.trim();
    if (!name) return alert("Enter your name first!");
    const lockRef = ref(db, 'lock');
    get(lockRef).then(snap => {
      if (snap.val()) return;
      const playerRef = ref(db, 'players/' + side);
      runTransaction(playerRef, current => {
        if (current === null) return { id: userId, name };
        return;
      });
    });
  }

  function vote(side) {
    const voteRef = ref(db, 'votes/' + side);
    runTransaction(voteRef, v => (v || 0) + 1);
  }

  function resetGame() {
    set(ref(db, '/'), {
      players: {},
      votes: {},
      lock: false,
      time: 60
    });
  }

  function toggleLock() {
    const lockRef = ref(db, 'lock');
    runTransaction(lockRef, v => !v);
  }

  function startTimer() {
    const timerRef = ref(db, 'time');
    set(timerRef, 60);
    const interval = setInterval(() => {
      runTransaction(timerRef, t => {
        if (t <= 0) {
          clearInterval(interval);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
  }

  const playersRef = ref(db, 'players');
  onValue(playersRef, snap => {
    const p = snap.val() || {};
    if (p.agree && p.disagree) {
      document.getElementById("matchup").innerText = `🔵 ${p.agree.name} VS 🔴 ${p.disagree.name}`;
      startTimer();
    }
  });

  const timeRef = ref(db, 'time');
  onValue(timeRef, snap => {
    const t = snap.val();
    if (t !== null) document.getElementById("timer").innerText = `⏱ ${t}s remaining`;
  });

  const votesRef = ref(db, 'votes');
  onValue(votesRef, snap => {
    const v = snap.val() || {};
    document.getElementById("votes").innerText = `Votes — 🔵 ${v.agree || 0} | 🔴 ${v.disagree || 0}`;
  });
</script>

</body>
</html>
